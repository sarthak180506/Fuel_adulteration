; PlatformIO Project Configuration File for FuelGuard ESP32 Firmware
;
; Board: ESP32 DevKit v1 (Espressif ESP32)
; Framework: Arduino
; Build system: PlatformIO

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Libraries
lib_deps =
    ; MQTT client
    knolleary/PubSubClient @ ^2.8

    ; DS18B20 1-Wire temperature sensor
    paulstoffregen/OneWire @ ^2.3
    milesburton/DallasTemperature @ ^3.11

    ; JSON serialisation for MQTT payloads
    bblanchon/ArduinoJson @ ^7.1

    ; TFLite-Micro (use Espressif's optimised fork)
    ; https://github.com/espressif/esp-tflite-micro
    ; Add manually via lib/tflite_micro (see README)

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_ARCH_ESP32
    ; TFLite-Micro requires C++17
    -std=gnu++17
    -DTF_LITE_STATIC_MEMORY

build_unflags =
    -std=gnu++11

; Partition scheme: 4 MB flash, larger app partition for TFLite model
board_build.partitions = huge_app.csv

; OTA upload (optional)
upload_protocol = esptool
